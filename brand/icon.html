<!-- App icon (dusk sky, sun, coaster hill and car; redrawn 2026-11-15): a coaster car on a track curve, drawn in code, rendered by node_modules/co-engine/tools/render-brand.js.
     ?size=256 sets the canvas; ?simple=1 drops the track and crops to the car for 32px and below. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage { position: relative; overflow: hidden; }
  .badge { position: absolute; inset: 0; border-radius: 22.3%; background:
      radial-gradient(120% 110% at 28% 18%, #2b3440 0%, #1a222c 42%, #0e141b 74%, #080a0d 100%); }
  .rim { position: absolute; inset: 0; border-radius: 22.3%; box-shadow: inset 0 0 0 var(--rim) rgba(245, 181, 61, .40); }
  .gloss { position: absolute; left: 0; right: 0; top: 0; height: 46%; border-radius: 22.3% 22.3% 50% 50% / 30% 30% 100% 100%;
      background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,0)); }
  .mark { position: absolute; left: 0; top: 0; border-radius: 22.3%; overflow: hidden; }
  .mark svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div class="badge"></div>
  <div class="gloss"></div>
  <div class="mark" id="mark"></div>
  <div class="rim" id="rim"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var S = +q.get('size') || 256, simple = q.get('simple') === '1';
  var stage = document.getElementById('stage');
  stage.style.width = S + 'px'; stage.style.height = S + 'px';
  document.documentElement.style.setProperty('--rim', Math.max(1, Math.round(S * 0.012)) + 'px');
  var mark = document.getElementById('mark');
  mark.style.width = S + 'px'; mark.style.height = S + 'px';
  // 2026-11-15 (tison: the icon felt old): a dusk sky, a big low sun, a white coaster hill and the amber car on its crest. Full bleed, so the
  // mark carries its own background and the badge only rounds it.
  var defs = '<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141842"/><stop offset=".42" stop-color="#4a2b7c"/><stop offset=".72" stop-color="#c9507a"/><stop offset="1" stop-color="#f7a24c"/></linearGradient>' +
    '<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08f"/><stop offset="1" stop-color="#f5a03d"/></linearGradient></defs>';
  var bg = '<rect width="100" height="100" fill="url(#sky)"/>';
  var stars = '<g fill="#fff" opacity=".75"><circle cx="16" cy="14" r="1"/><circle cx="80" cy="10" r="1.2"/><circle cx="64" cy="20" r=".8"/><circle cx="30" cy="24" r=".8"/><circle cx="90" cy="28" r=".9"/></g>';
  var sun = '<circle cx="50" cy="70" r="27" fill="url(#sun)"/>';
  var rail = 'M-4 80 C18 80 24 31 50 31 C76 31 82 80 104 80';
  var track =
    '<path d="' + rail + '" fill="none" stroke="#120d2b" stroke-width="11" stroke-linecap="round"/>' +
    '<path d="' + rail + '" fill="none" stroke="#f4f1ea" stroke-width="5.2" stroke-linecap="round"/>';
  var ground = '<path d="M0 86 Q28 77 52 84 T100 82 L100 100 L0 100 Z" fill="#0d0a24"/>';
  var car =
    '<g transform="translate(50,31) scale(0.78) translate(-50,-50)">' +
    '<circle cx="37" cy="43.6" r="3.6" fill="#1c2128" stroke="#8a95a4" stroke-width="1.8"/>' +
    '<circle cx="63" cy="43.6" r="3.6" fill="#1c2128" stroke="#8a95a4" stroke-width="1.8"/>' +
    '<path d="M29 40.6 L29 32.6 Q29 29.6 32 29.6 L57 29.6 Q65 29.6 68 35 L71 39 Q71.6 40.6 70 40.6 Z" fill="#f5b53d" stroke="#a8731a" stroke-width="2" stroke-linejoin="round"/>' +
    '<rect x="29" y="18" width="6.5" height="16.6" rx="3.2" fill="#f5b53d" stroke="#a8731a" stroke-width="2"/>' +
    '<circle cx="42" cy="20.5" r="4.8" fill="#f4f7fb"/>' +
    '<path d="M37.5 31.6 Q37.5 25 42 25 Q46.5 25 46.5 31.6 Z" fill="#f4f7fb"/></g>';
  // the tiny sizes keep the sky, the sun and the car only, large and thick
  var carS = car.replace('translate(50,31) scale(0.78) translate(-50,-50)', 'translate(0,4)');
  var inner = simple ? bg + '<circle cx="50" cy="58" r="34" fill="url(#sun)"/>' + carS : bg + stars + sun + track + ground + car;
  var vb = simple ? '14 6 72 72' : '0 0 100 100';
  mark.innerHTML = '<svg viewBox="' + vb + '" preserveAspectRatio="xMidYMid slice">' + defs + inner + '</svg>';
</script>
</body>
</html>
