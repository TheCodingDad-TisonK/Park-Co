<!-- App icon: a coaster car on a track curve, drawn in code, rendered by node_modules/co-engine/tools/render-brand.js.
     ?size=256 sets the canvas; ?simple=1 drops the track and crops to the car for 32px and below. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage { position: relative; overflow: hidden; }
  .badge { position: absolute; inset: 0; border-radius: 22.3%; background:
      radial-gradient(120% 110% at 28% 18%, #2b3440 0%, #1a222c 42%, #0e141b 74%, #080a0d 100%); }
  .rim { position: absolute; inset: 0; border-radius: 22.3%; box-shadow: inset 0 0 0 var(--rim) rgba(245, 181, 61, .40); }
  .gloss { position: absolute; left: 0; right: 0; top: 0; height: 46%; border-radius: 22.3% 22.3% 50% 50% / 30% 30% 100% 100%;
      background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,0)); }
  .mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .mark svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div class="badge"></div>
  <div class="gloss"></div>
  <div class="mark" id="mark"></div>
  <div class="rim" id="rim"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var S = +q.get('size') || 256, simple = q.get('simple') === '1';
  var stage = document.getElementById('stage');
  stage.style.width = S + 'px'; stage.style.height = S + 'px';
  document.documentElement.style.setProperty('--rim', Math.max(1, Math.round(S * 0.012)) + 'px');
  var size = Math.round(S * (simple ? 0.82 : 0.76));
  var mark = document.getElementById('mark');
  mark.style.width = size + 'px'; mark.style.height = size + 'px';
  mark.style.filter = 'drop-shadow(0 ' + (S * 0.012) + 'px ' + (S * 0.02) + 'px rgba(0,0,0,.55))';
  // the rail: a dark bed, a steel rail and a highlight down the middle, rising to a flat crest and falling away
  var rail = 'M10 78 C22 78 24 50 34 50 L66 50 C76 50 78 78 90 78';
  var track =
    '<path d="' + rail + '" fill="none" stroke="#232a33" stroke-width="12" stroke-linecap="round"/>' +
    '<path d="' + rail + '" fill="none" stroke="#5b6672" stroke-width="6" stroke-linecap="round"/>' +
    '<path d="' + rail + '" fill="none" stroke="#93a3b3" stroke-width="1.8" stroke-linecap="round"/>';
  // the car sits level on the crest: two wheels, an amber tub with a sloped nose, a seat back and a rider
  var car =
    '<circle cx="37" cy="43.6" r="3.4" fill="#1c2128" stroke="#6a7482" stroke-width="1.8"/>' +
    '<circle cx="63" cy="43.6" r="3.4" fill="#1c2128" stroke="#6a7482" stroke-width="1.8"/>' +
    '<path d="M29 40.6 L29 32.6 Q29 29.6 32 29.6 L57 29.6 Q65 29.6 68 35 L71 39 Q71.6 40.6 70 40.6 Z" fill="#f5b53d" stroke="#b07d1c" stroke-width="2" stroke-linejoin="round"/>' +
    '<rect x="29" y="18" width="6.5" height="16.6" rx="3.2" fill="#f5b53d" stroke="#b07d1c" stroke-width="2"/>' +
    '<circle cx="42" cy="20.5" r="4.8" fill="#e8eef5"/>' +
    '<path d="M37.5 31.6 Q37.5 25 42 25 Q46.5 25 46.5 31.6 Z" fill="#e8eef5"/>';
  // the tiny sizes keep only the car, cropped to it so the strokes stay thick
  var vb = simple ? '26 7 48 48' : '0 0 100 100';
  mark.innerHTML = '<svg viewBox="' + vb + '">' + (simple ? car : track + car) + '</svg>';
</script>
</body>
</html>
