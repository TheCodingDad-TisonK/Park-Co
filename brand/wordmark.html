<!-- Horizontal lockup: the coaster car badge beside the PARK CO wordmark. ?w= sets the width, ?dark=0 for a light background.
     Rendered by node_modules/co-engine/tools/render-brand.js. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage { display: inline-flex; align-items: center; gap: 0; }   /* shrink-wraps so the capture has no dead space */
  .mark { position: relative; flex: none; }
  .badge { position: absolute; inset: 0; border-radius: 22.3%; background: radial-gradient(120% 110% at 28% 18%, #2b3440 0%, #1a222c 42%, #0e141b 74%, #080a0d 100%); }
  .rim { position: absolute; inset: 0; border-radius: 22.3%; box-shadow: inset 0 0 0 2px rgba(245,181,61,.40); }
  .art { position: absolute; left: 0; top: 0; border-radius: 22.3%; overflow: hidden; }
  .art svg { display: block; width: 100%; height: 100%; }
  .type { display: flex; flex-direction: column; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; }
  .type .name { font-weight: 800; letter-spacing: -0.5px; line-height: .95; color: var(--ink); }
  .type .name em { font-style: normal; color: #f5b53d; }
  .type .sub { font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--sub); }
</style>
</head>
<body>
<div id="stage">
  <div class="mark" id="mark">
    <div class="art" id="art"></div>
    <div class="rim"></div>
  </div>
  <div class="type" id="type">
    <div class="name" id="name">Park <em>Co</em></div>
    <div class="sub" id="sub">by TheCodingDad</div>
  </div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var W = +q.get('w') || 1200, dark = q.get('dark') !== '0';
  var u = W / 1200;   // everything is drawn against a 1200 px reference and scaled
  document.documentElement.style.setProperty('--ink', dark ? '#f2f4f7' : '#12161b');
  document.documentElement.style.setProperty('--sub', dark ? '#9aa4b0' : '#5d6873');
  var badge = Math.round(300 * u);
  var mark = document.getElementById('mark');
  mark.style.width = badge + 'px'; mark.style.height = badge + 'px';
  var art = document.getElementById('art'); var as = badge;
  art.style.width = as + 'px'; art.style.height = as + 'px';
  // the same dusk, sun, hill and car as the app icon (redrawn 2026-11-15)
  art.innerHTML = "<svg viewBox=\"0 0 100 100\" preserveAspectRatio=\"xMidYMid slice\"><defs><linearGradient id=\"sky\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#141842\"/><stop offset=\".42\" stop-color=\"#4a2b7c\"/><stop offset=\".72\" stop-color=\"#c9507a\"/><stop offset=\"1\" stop-color=\"#f7a24c\"/></linearGradient><linearGradient id=\"sun\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ffe08f\"/><stop offset=\"1\" stop-color=\"#f5a03d\"/></linearGradient></defs><rect width=\"100\" height=\"100\" fill=\"url(#sky)\"/><g fill=\"#fff\" opacity=\".75\"><circle cx=\"16\" cy=\"14\" r=\"1\"/><circle cx=\"80\" cy=\"10\" r=\"1.2\"/><circle cx=\"64\" cy=\"20\" r=\".8\"/><circle cx=\"30\" cy=\"24\" r=\".8\"/><circle cx=\"90\" cy=\"28\" r=\".9\"/></g><circle cx=\"50\" cy=\"70\" r=\"27\" fill=\"url(#sun)\"/><path d=\"M-4 80 C18 80 24 31 50 31 C76 31 82 80 104 80\" fill=\"none\" stroke=\"#120d2b\" stroke-width=\"11\" stroke-linecap=\"round\"/><path d=\"M-4 80 C18 80 24 31 50 31 C76 31 82 80 104 80\" fill=\"none\" stroke=\"#f4f1ea\" stroke-width=\"5.2\" stroke-linecap=\"round\"/><path d=\"M0 86 Q28 77 52 84 T100 82 L100 100 L0 100 Z\" fill=\"#0d0a24\"/><g transform=\"translate(50,31) scale(0.78) translate(-50,-50)\"><circle cx=\"37\" cy=\"43.6\" r=\"3.6\" fill=\"#1c2128\" stroke=\"#8a95a4\" stroke-width=\"1.8\"/><circle cx=\"63\" cy=\"43.6\" r=\"3.6\" fill=\"#1c2128\" stroke=\"#8a95a4\" stroke-width=\"1.8\"/><path d=\"M29 40.6 L29 32.6 Q29 29.6 32 29.6 L57 29.6 Q65 29.6 68 35 L71 39 Q71.6 40.6 70 40.6 Z\" fill=\"#f5b53d\" stroke=\"#a8731a\" stroke-width=\"2\" stroke-linejoin=\"round\"/><rect x=\"29\" y=\"18\" width=\"6.5\" height=\"16.6\" rx=\"3.2\" fill=\"#f5b53d\" stroke=\"#a8731a\" stroke-width=\"2\"/><circle cx=\"42\" cy=\"20.5\" r=\"4.8\" fill=\"#f4f7fb\"/><path d=\"M37.5 31.6 Q37.5 25 42 25 Q46.5 25 46.5 31.6 Z\" fill=\"#f4f7fb\"/></g></svg>";
  var type = document.getElementById('type');
  type.style.marginLeft = Math.round(46 * u) + 'px';
  document.getElementById('name').style.fontSize = Math.round(150 * u) + 'px';
  var sub = document.getElementById('sub');
  sub.style.fontSize = Math.round(37 * u) + 'px';
  sub.style.marginTop = Math.round(14 * u) + 'px';
  // the canvas is trimmed to whatever the lockup actually measures
  requestAnimationFrame(function () {
    var r = document.getElementById('stage').getBoundingClientRect();
    document.title = Math.ceil(r.width) + 'x' + Math.ceil(r.height);
  });
</script>
</body>
</html>
