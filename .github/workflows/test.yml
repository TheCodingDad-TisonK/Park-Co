name: Tests

# Every push to main, development and a feature branch, and every pull request: the repo checks (the parts build the game
# file exactly, the version stamp, the lint gate, syntax), then the game's test suite in a hidden Electron window with
# software WebGL. A second job runs the soak (hours of simulated play, looking for guests frozen in a state).

on:
  push:
    branches: [main, development, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Read access to the engine repo (public)
        shell: bash
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true   # the checkout token would be sent instead, and it cannot see Co-Engine
          git config --global url."https://github.com/TheCodingDad-TisonK/Co-Engine".insteadOf "ssh://git@github.com/TheCodingDad-TisonK/Co-Engine"
          git config --global --add url."https://github.com/TheCodingDad-TisonK/Co-Engine".insteadOf "git@github.com:TheCodingDad-TisonK/Co-Engine"
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          CI: 'true'

  soak:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Read access to the engine repo (public)
        shell: bash
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url."https://github.com/TheCodingDad-TisonK/Co-Engine".insteadOf "ssh://git@github.com/TheCodingDad-TisonK/Co-Engine"
          git config --global --add url."https://github.com/TheCodingDad-TisonK/Co-Engine".insteadOf "git@github.com:TheCodingDad-TisonK/Co-Engine"
      - run: npm ci
      - run: npm run soak
        env:
          CI: 'true'
          SOAK_HOURS: '7'
